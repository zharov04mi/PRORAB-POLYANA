<title>Прорабский журнал</title>
<style>
:root{--bg:#f5f5f3;--surface:#fff;--ink:#161616;--muted:#75757a;--line:#e8e8e5;--accent:#e8590c;--bad:#c62828}
*{box-sizing:border-box}html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;display:flex;align-items:center;justify-content:center;padding:24px calc(16px + env(safe-area-inset-right)) 24px calc(16px + env(safe-area-inset-left))}
form{width:100%;max-width:360px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:24px 20px;display:grid;gap:14px}
.logo{width:56px;height:56px;border-radius:14px;display:block}
h1{margin:0;font-size:20px}p{margin:0;color:var(--muted);font-size:14px;line-height:1.45}
input[type=password]{width:100%;min-height:48px;padding:10px 14px;border:1px solid var(--line);border-radius:12px;font-size:17px;background:#fff;color:var(--ink)}
input[type=password]:focus{outline:2px solid var(--accent);outline-offset:1px}
label.rm{display:flex;align-items:center;gap:10px;font-size:14px}label.rm input{width:20px;height:20px}
button{min-height:48px;border:0;border-radius:12px;background:var(--accent);color:#fff;font-size:16px;font-weight:600;cursor:pointer}
button:disabled{opacity:.6}.err{color:var(--bad);font-size:14px;min-height:0}.err:empty{display:none}
</style></head><body>

const K = 'prorab-demo-key';
const ub = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const show = html => { const go = () => { document.open(); document.write(html); document.close(); }; if (document.readyState === 'complete') go(); else window.addEventListener('load', () => setTimeout(go, 0), {once:true}); };
async function open(key){ const pt = await crypto.subtle.decrypt({name:'AES-GCM', iv:ub(D.i)}, key, ub(D.c)); return new TextDecoder().decode(pt); }
async function derive(pw){ const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2', salt:ub(D.s), iterations:D.n, hash:'SHA-256'}, base, {name:'AES-GCM', length:256}, true, ['decrypt']); }
(async () => {
  if (!window.crypto || !crypto.subtle){ document.getElementById('err').textContent = 'Откройте страницу по ссылке https:// в Safari или Chrome.'; return; }
  try { const saved = localStorage.getItem(K); if (saved){ const key = await crypto.subtle.importKey('raw', ub(saved), 'AES-GCM', true, ['decrypt']); show(await open(key)); return; } } catch (e) { try { localStorage.removeItem(K); } catch (e2) {} }

document.getElementById('f').addEventListener('submit', async ev => {
  ev.preventDefault();
  const b = document.getElementById('go'), er = document.getElementById('err');
  b.disabled = true; b.textContent = 'Открываю…'; er.textContent = '';
  try {
    const key = await derive(document.getElementById('pw').value);
    const html = await open(key);
    if (document.getElementById('rm').checked){ try { const raw = new Uint8Array(await crypto.subtle.exportKey('raw', key)); localStorage.setItem(K, btoa(String.fromCharCode(...raw))); } catch (e) {} }
